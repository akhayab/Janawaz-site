
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janawaz 2.0</title>
<link rel="stylesheet" href="style.css">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fa;
color:#333;
}

header{
background:linear-gradient(135deg,#0057B8,#00A651);
color:#fff;
padding:18px 8%;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.logo{
font-size:30px;
font-weight:bold;
}

nav a{
text-decoration:none;
color:white;
margin:0 12px;
font-weight:bold;
}

nav a:hover{
color:#FFD54F;
}

.btn{
background:#fff;
color:#0057B8;
padding:10px 20px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
margin-left:10px;
}

.hero{
text-align:center;
padding:100px 20px;
background:linear-gradient(rgba(0,87,184,.75),rgba(0,166,81,.75));
color:white;
}

.hero h1{
font-size:50px;
margin-bottom:15px;
}

.hero p{
font-size:20px;
max-width:700px;
margin:auto;
line-height:1.7;
}

.hero-buttons{
margin-top:35px;
}

.hero-buttons a{
display:inline-block;
margin:10px;
padding:14px 28px;
border-radius:40px;
text-decoration:none;
font-weight:bold;
}

.report{
background:#FF9800;
color:white;
}

.volunteer{
background:white;
color:#0057B8;
}
</style>
</head>

<body>

<header>

<div class="logo">JANAWAZ</div>

<nav>
<a href="#">Home</a>
<a href="#">Report</a>
<a href="#">Track</a>
<a href="#">Volunteer</a>
<a href="#">Updates</a>
<a href="#">Contact</a>
</nav>

<div>
<a class="btn" href="#">Login</a>
<a class="btn" href="#">Sign Up</a>
</div>

</header>

<section class="hero">

<h1>Your Voice, Our Mission</h1>

<p>
Raise your voice. Report public issues, join as a volunteer,
and help build a transparent and accountable society.
</p>

<div class="hero-buttons">

<a class="report" href="#">Report Issue</a>

<a class="volunteer" href="#">Join Volunteer</a>

</div>

</section>

</body>
</html>
